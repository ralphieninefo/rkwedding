name: rkwedding
region: nyc
databases:
  - engine: PG
    name: wedding-db
    production: true
services:
  - name: web
    git:
      repo_clone_url: https://github.com/ralphieninefo/rkwedding.git
      branch: main
    environment_slug: python
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    run_command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    http_port: 8080
    routes:
      - path: /
    health_check:
      http_path: /health
    envs:
      - key: APP_ENV
        value: production
        scope: RUN_TIME
        type: GENERAL
      - key: DATABASE_URL
        value: ${wedding-db.DATABASE_URL}
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_SPREADSHEET_ID
        value: 1CTQ7ochPaQS3ZMREeWDZDyiRcBw_hqyUN_eyrwbHxS0
        scope: RUN_TIME
        type: GENERAL
      - key: GOOGLE_VENUES_SHEET
        value: Venues
        scope: RUN_TIME
        type: GENERAL
      - key: CONTROL_CENTER_USERNAME
        value: raph
        scope: RUN_TIME
        type: GENERAL
      # Required: fill this encrypted value in the App Platform UI before deploy.
      - key: CONTROL_CENTER_PASSWORD
        value: ""
        scope: RUN_TIME
        type: SECRET
