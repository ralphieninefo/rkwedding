<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Every venue, with a shortlist comparison.">
    <title>All Venues · Wedding Venue Control Center</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/shell.css">
    <link rel="stylesheet" href="/static/home.css">
    <link rel="stylesheet" href="/static/venues.css">
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Wedding Venue Control Center home">
        <span class="brand-mark" aria-hidden="true">KR</span>
        <span><strong>Venue Control Center</strong><small>Kassia &amp; Raphaël</small></span>
      </a>
      <nav class="site-nav" aria-label="Control center pages">
        <a href="/">Next up</a>
        <a class="active" href="/venues">All venues</a>
      </nav>
      <div class="header-tools">
        <a class="icon-button" href="/#settings" title="Settings" aria-label="Settings">⚙</a>
        <button class="session-link" id="logoutButton" type="button">Sign out</button>
      </div>
    </header>

    <main class="page-shell">
      <section class="page-intro">
        <div>
          <p class="eyebrow">Complete reference</p>
          <h1>All venue information.</h1>
          <p id="directorySummary">Loading…</p>
        </div>
      </section>

      <section class="panel compare-panel" id="comparePanel" hidden>
        <div class="compare-head">
          <div><p class="eyebrow">Shortlist</p><h2>Compare your shortlist</h2></div>
          <p class="compare-budget" id="compareBudget"></p>
        </div>
        <div class="compare-wrap">
          <table class="compare-table">
            <thead><tr><th>Venue</th><th>Region</th><th>Estimate for 90</th><th>vs budget</th><th>Capacity</th><th>Availability</th><th>Status</th><th>Visit</th></tr></thead>
            <tbody id="compareRows"></tbody>
          </table>
        </div>
        <p class="compare-hint" id="compareHint"></p>
      </section>

      <div class="toolbar">
        <label class="search"><span>Search venues</span><input id="venueSearch" type="search" placeholder="Name, region, e-mail, status…" autocomplete="off"></label>
        <label class="sort"><span>Order by</span><select id="venueSort"><option value="name">Name</option><option value="price">Estimate</option><option value="activity">Recent activity</option><option value="added">Recently added</option></select></label>
      </div>
      <p class="tracker-message" id="directoryMessage">Loading venue directory…</p>
      <ul class="venue-list" id="venueList" hidden></ul>
    </main>

    <footer class="site-footer"><span>Private app · Kassia &amp; Raphaël</span></footer>
    <script src="/static/venues.js?v=20260903-3" defer></script>
  </body>
</html>
